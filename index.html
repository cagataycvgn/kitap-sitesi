<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web E-Kitap Okuyucu</title>
    <!-- PDF Desteği için PDF.js kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #e2e8f0;
        }

        [data-sepia="true"] {
            --bg-color: #fef3c7;
            --panel-bg: #fde68a;
            --text-color: #78350f;
            --text-muted: #92400e;
            --accent-color: #d97706;
            --accent-hover: #b45309;
            --border-color: #fcd34d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar */
        aside {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .upload-btn-container {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .custom-file-upload:hover {
            background-color: var(--accent-hover);
        }

        #file-input {
            display: none;
        }

        .book-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .book-item {
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background-color 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.95rem;
        }

        .book-item:hover {
            background-color: var(--border-color);
        }

        .book-item.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* Main Content / Reader Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        header {
            height: 60px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--border-color);
        }

        #viewer-container {
            flex: 1;
            position: relative;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
        }

        #viewer {
            width: 100%;
            max-width: 800px;
            height: 100%;
            background: var(--panel-bg);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border-radius: 8px;
            padding: 40px;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        /* PDF Canvas Style */
        #pdf-viewer-canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .pdf-page-canvas {
            max-width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 15px;
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <h1>Kütüphanem</h1>
        </div>
        <div class="upload-btn-container">
            <label class="custom-file-upload">
                📁 Yeni Kitap Yükle
                <input type="file" id="file-input" accept=".epub, .pdf, .zip">
            </label>
        </div>
        <div class="book-list" id="book-list">
            <!-- Kitaplar buraya gelecek -->
        </div>
    </aside>

    <main>
        <header>
            <div id="current-book-title" style="font-weight: 600;">Kitap Seçilmedi</div>
            <div class="controls">
                <button onclick="changeTheme('dark')">🌙</button>
                <button onclick="changeTheme('light')">☀️</button>
                <button onclick="changeTheme('sepia')">📜</button>
                <button id="prev-btn">Önceki</button>
                <span id="page-info">0 / 0</span>
                <button id="next-btn">Sonraki</button>
            </div>
        </header>

        <div id="viewer-container">
            <div id="viewer">
                <div class="placeholder">
                    <h2>Henüz bir kitap açılmadı</h2>
                    <p>Soldaki menüden bir kitap seçin veya kendi kitabınızı yükleyin.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- JSZip ve ePub.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>

    <script>
        let book = null;
        let rendition = null;

        // Ortak kitaplar (ornek.pdf ana dizine taşındığı için yolu güncellendi)
        let defaultBooks = [
            {
                name: "Örnek Kitap.pdf",
                url: "ornek.pdf",
                type: "pdf"
            }
        ];

        let userBooks = JSON.parse(localStorage.getItem('saved_books') || '[]');
        let allBooks = [...defaultBooks, ...userBooks];

        const fileInput = document.getElementById('file-input');
        const bookListEl = document.getElementById('book-list');
        const viewerEl = document.getElementById('viewer');
        const titleEl = document.getElementById('current-book-title');
        const pageInfoEl = document.getElementById('page-info');

        renderBookList();

        function renderBookList() {
            bookListEl.innerHTML = '';
            allBooks.forEach((b) => {
                const div = document.createElement('div');
                div.className = 'book-item';
                div.textContent = b.name;
                div.onclick = () => openBook(b);
                bookListEl.appendChild(div);
            });
        }

        async function openBook(bookObj) {
            titleEl.textContent = bookObj.name;
            viewerEl.innerHTML = '<div style="text-align:center; padding:20px;">Yükleniyor...</div>';

            if (bookObj.url) {
                if (bookObj.type === 'pdf') {
                    loadPdf(bookObj.url);
                }
            } else if (bookObj.data) {
                if (bookObj.type === 'pdf') {
                    loadPdf(bookObj.data);
                } else {
                    loadEpub(bookObj.data);
                }
            }
        }

        async function loadPdf(source) {
            viewerEl.innerHTML = '<div id="pdf-viewer-canvas-container"></div>';
            const container = document.getElementById('pdf-viewer-canvas-container');
            
            try {
                const loadingTask = pdfjsLib.getDocument(source);
                const pdfDoc = await loadingTask.promise;
                
                pageInfoEl.textContent = `Toplam Sayfa: ${pdfDoc.numPages}`;

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page-canvas';
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    container.appendChild(canvas);

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;
                }
            } catch (error) {
                viewerEl.innerHTML = '<p style="color: red; text-align: center;">Kitap yüklenirken hata oluştu! Dosya yolunu kontrol edin.</p>';
            }
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                const typedarray = new Uint8Array(event.target.result);
                const newBook = {
                    name: file.name,
                    data: typedarray,
                    type: 'pdf'
                };
                userBooks.push(newBook);
                localStorage.setItem('saved_books', JSON.stringify(userBooks));
                allBooks = [...defaultBooks, ...userBooks];
                renderBookList();
                openBook(newBook);
            };
            reader.readAsArrayBuffer(file);
        });

        function changeTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                document.documentElement.removeAttribute('data-sepia');
            } else if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.removeAttribute('data-sepia');
            } else if (theme === 'sepia') {
                document.documentElement.setAttribute('data-sepia', 'true');
                document.documentElement.removeAttribute('data-theme');
            }
        }
    </script>
</body>
</html>
